<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Animal Scanner</title>
  <style>
    :root { --green: #2f7d4f; --ink: #1f2a24; --muted: #5d6b63; --card: #ffffff; }
    html, body { margin: 0; height: 100%; background: #0b0f0d; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; color: var(--ink); }
    #cam { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    video { display: none; }
    #view3d { position: fixed; left: 0; right: 0; top: 56px; height: 40vh; display: none; touch-action: none; cursor: grab; }
    #view3d canvas { width: 100%; height: 100%; display: block; }
    body.showing #view3d { display: block; }

    .status {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6;
      background: rgba(255,255,255,0.92); color: var(--ink); padding: 8px 16px; border-radius: 20px;
      font-size: 14px; font-weight: 600; white-space: nowrap; box-shadow: 0 2px 12px rgba(0,0,0,0.25); pointer-events: none;
    }
    #reticle { position: fixed; left: 50%; top: 46%; width: 62vmin; height: 62vmin; transform: translate(-50%, -50%); pointer-events: none; z-index: 2; }
    #reticle .c { position: absolute; width: 34px; height: 34px; border: 4px solid #fff; border-radius: 6px; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5)); }
    #reticle .tl { top: 0; left: 0; border-right: none; border-bottom: none; }
    #reticle .tr { top: 0; right: 0; border-left: none; border-bottom: none; }
    #reticle .bl { bottom: 0; left: 0; border-right: none; border-top: none; }
    #reticle .br { bottom: 0; right: 0; border-left: none; border-top: none; }
    #reticle .line { position: absolute; left: 8px; right: 8px; height: 3px; border-radius: 2px; background: #7dffad;
      box-shadow: 0 0 14px 2px rgba(125,255,173,0.8); animation: sweep 2.2s ease-in-out infinite alternate; }
    @keyframes sweep { from { top: 6%; } to { top: 92%; } }
    #reticle { transition: opacity 0.3s; }
    body.detecting #reticle { opacity: 0.2; }
    body.showing #reticle { display: none; }

    .bar { position: fixed; bottom: 16px; left: 0; right: 0; z-index: 4; display: flex; justify-content: center; gap: 10px; }
    body.showing .bar { display: none; }
    button { font: inherit; cursor: pointer; }
    .pill { background: rgba(255,255,255,0.92); color: var(--ink); border: none; font-size: 15px; font-weight: 700;
      padding: 11px 18px; border-radius: 22px; box-shadow: 0 2px 12px rgba(0,0,0,0.25); }

    #card {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card);
      border-radius: 22px 22px 0 0; box-shadow: 0 -6px 30px rgba(0,0,0,0.3);
      padding: 10px 18px 16px; max-height: 54vh; overflow-y: auto; box-sizing: border-box;
      transform: translateY(105%); transition: transform 0.45s cubic-bezier(.2,.9,.25,1.1);
      max-width: 640px; margin: 0 auto;
    }
    body.showing #card { transform: translateY(0); }
    .grab { width: 42px; height: 5px; border-radius: 3px; background: #d5dbd7; margin: 0 auto 10px; }
    .chead { display: flex; align-items: center; gap: 12px; }
    #cEmoji { font-size: 36px; line-height: 1; }
    #cName { margin: 0; font-size: 26px; letter-spacing: 0.2px; }
    #cSci { color: var(--muted); font-style: italic; font-size: 14px; }
    #cConf { margin-left: auto; background: #e6f4ea; color: var(--green); font-weight: 700; font-size: 12px; padding: 5px 10px; border-radius: 12px; white-space: nowrap; }
    #cDef { margin: 12px 0; line-height: 1.5; font-size: 15.5px; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .facts div { background: #f3f6f4; border-radius: 12px; padding: 8px 10px; font-size: 13.5px; }
    .facts b { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 2px; }
    .fun { margin-top: 10px; background: #fff7e0; border-radius: 12px; padding: 9px 12px; font-size: 14px; line-height: 1.4; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button { flex: 1; border: none; border-radius: 14px; padding: 12px 8px; font-weight: 700; font-size: 14.5px; }
    #speakBtn { background: #e6f4ea; color: var(--green); }
    #rescanBtn { background: var(--green); color: #fff; }
    #listBtn2 { flex: 0 0 52px; background: #f3f6f4; }

    #list { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,0.55); display: none; align-items: flex-end; justify-content: center; }
    #list.open { display: flex; }
    #list .sheet { background: #fff; width: 100%; max-width: 640px; border-radius: 22px 22px 0 0; padding: 18px; box-sizing: border-box; }
    #list h3 { margin: 0 0 12px; }
    #list .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    #list .grid button { border: none; background: #f3f6f4; border-radius: 14px; padding: 10px 2px; font-size: 26px; }
    #list .grid button span { display: block; font-size: 11px; font-weight: 600; margin-top: 2px; color: var(--ink); }
    #list .close { margin-top: 12px; width: 100%; border: none; background: #e9ecea; border-radius: 14px; padding: 12px; font-weight: 700; }

    #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 24px; background: radial-gradient(circle at 50% 35%, #e9f6ec, #b9dcc4 75%); }
    #start h1 { margin: 0; font-size: 30px; color: var(--green); }
    #start p { margin: 0; max-width: 340px; line-height: 1.5; color: #2c3a32; }
    #start .emojis { font-size: 28px; letter-spacing: 4px; }
    #startBtn { background: var(--green); color: #fff; border: none; font-size: 18px; font-weight: 700; padding: 14px 30px; border-radius: 24px; }
  </style>
</head>
<body>
  <div id="start">
    <h1>🔍 Animal Scanner</h1>
    <div class="emojis">🐕🐈🐎🐑🐄🐘🐻🦓🦒🐦</div>
    <p>Point your camera at an animal — a real one, a toy, or a picture in a book or on a screen. When it's recognized you'll see what it is and a 3D model of it.</p>
    <button id="startBtn">Start scanning</button>
    <p id="loadMsg" style="font-size:13px"></p>
  </div>

  <canvas id="cam"></canvas>
  <video id="v" playsinline muted></video>
  <div id="reticle"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><i class="line"></i></div>
  <div class="status" id="status">Loading…</div>
  <div id="view3d"></div>

  <div class="bar">
    <button class="pill" id="listBtn">📖 Animals</button>
    <button class="pill" id="flipBtn">🔄 Camera</button>
  </div>

  <div id="card">
    <div class="grab"></div>
    <div class="chead">
      <span id="cEmoji"></span>
      <div><h2 id="cName"></h2><div id="cSci"></div></div>
      <span id="cConf"></span>
    </div>
    <p id="cDef"></p>
    <div class="facts">
      <div><b>Class</b><span id="fClass"></span></div>
      <div><b>Diet</b><span id="fDiet"></span></div>
      <div><b>Habitat</b><span id="fHab"></span></div>
      <div><b>Lifespan</b><span id="fLife"></span></div>
    </div>
    <div class="fun">💡 <span id="cFact"></span></div>
    <div class="actions">
      <button id="speakBtn">🔊 Read aloud</button>
      <button id="rescanBtn">🔍 Scan again</button>
      <button id="listBtn2" aria-label="Browse animals">📖</button>
    </div>
  </div>

  <div id="list"><div class="sheet"><h3>Browse animals</h3><div class="grid" id="grid"></div><button class="close" id="closeList">Close</button></div></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { FilesetResolver, ObjectDetector } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.0/vision_bundle.mjs';

    // =====================================================================
    // ANIMAL INFORMATION (edit the text here)
    // =====================================================================
    const ANIMALS = {
      dog: { name: 'Dog', emoji: '🐕', sci: 'Canis familiaris', cls: 'Mammal', diet: 'Omnivore', habitat: 'Worldwide, alongside humans', life: '10–13 years',
        def: 'A domesticated mammal descended from wolves, kept as a companion, guard or working animal. Dogs have an excellent sense of smell and hearing, and were the first animals ever domesticated by humans.',
        fact: "A dog's nose print is unique, just like a human fingerprint." },
      cat: { name: 'Cat', emoji: '🐈', sci: 'Felis catus', cls: 'Mammal', diet: 'Carnivore', habitat: 'Homes worldwide', life: '12–18 years',
        def: 'A small domesticated carnivorous mammal with soft fur, sharp retractable claws and keen night vision. Cats are skilled hunters and have lived alongside humans for thousands of years.',
        fact: 'Cats sleep around 12 to 16 hours a day.' },
      horse: { name: 'Horse', emoji: '🐎', sci: 'Equus caballus', cls: 'Mammal', diet: 'Herbivore', habitat: 'Grasslands and farms worldwide', life: '25–30 years',
        def: 'A large, strong hoofed mammal with a long mane and tail. Horses have been domesticated for thousands of years for riding, farm work and transport.',
        fact: 'Horses can sleep both standing up and lying down.' },
      sheep: { name: 'Sheep', emoji: '🐑', sci: 'Ovis aries', cls: 'Mammal', diet: 'Herbivore', habitat: 'Farms and grasslands worldwide', life: '10–12 years',
        def: 'A domesticated grazing mammal with a thick woolly coat. Sheep are raised for their wool, milk and meat, and usually live together in flocks.',
        fact: 'Sheep have rectangular pupils that give them a very wide field of view.' },
      cow: { name: 'Cow', emoji: '🐄', sci: 'Bos taurus', cls: 'Mammal', diet: 'Herbivore', habitat: 'Farms and pastures worldwide', life: '18–22 years',
        def: 'A large domesticated hoofed mammal raised for milk, meat and leather. Cows are ruminants — their stomach has four compartments to help digest grass.',
        fact: 'Cows spend up to 8 hours a day chewing their cud.' },
      elephant: { name: 'Elephant', emoji: '🐘', sci: 'Family Elephantidae', cls: 'Mammal', diet: 'Herbivore', habitat: 'Savannas and forests of Africa and Asia', life: '60–70 years',
        def: 'The largest living land animal, with a long flexible trunk, large ears and ivory tusks. Elephants live in close family herds led by the oldest female.',
        fact: "An elephant's trunk contains tens of thousands of muscles." },
      bear: { name: 'Bear', emoji: '🐻', sci: 'Family Ursidae', cls: 'Mammal', diet: 'Omnivore (most species)', habitat: 'Forests, mountains and the Arctic', life: '20–30 years',
        def: 'A large, heavy mammal with thick fur, a short tail and powerful claws. Bears have an excellent sense of smell and can stand up on their hind legs.',
        fact: 'Many bears hibernate through winter, living off their stored body fat.' },
      zebra: { name: 'Zebra', emoji: '🦓', sci: 'Equus quagga (plains zebra)', cls: 'Mammal', diet: 'Herbivore', habitat: 'Grasslands and savannas of Africa', life: '20–25 years',
        def: 'A wild African member of the horse family, famous for its black-and-white striped coat. Zebras live in herds and graze on grasses.',
        fact: 'No two zebras have exactly the same stripe pattern.' },
      giraffe: { name: 'Giraffe', emoji: '🦒', sci: 'Giraffa camelopardalis', cls: 'Mammal', diet: 'Herbivore', habitat: 'Savannas and woodlands of Africa', life: '20–25 years',
        def: 'The tallest living land animal, with an extremely long neck and legs and a patterned coat. Giraffes use their height to eat leaves from tall trees.',
        fact: "A giraffe's tongue can be about 45 cm (18 in) long." },
      bird: { name: 'Bird', emoji: '🐦', sci: 'Class Aves', cls: 'Bird', diet: 'Varies by species', habitat: 'Every continent on Earth', life: 'Varies by species',
        def: 'A warm-blooded animal with feathers, wings and a beak that lays hard-shelled eggs. Most birds can fly, and there are over 10,000 species.',
        fact: 'Birds are the living descendants of dinosaurs.' }
    };
    const ORDER = ['dog', 'cat', 'horse', 'sheep', 'cow', 'elephant', 'bear', 'zebra', 'giraffe', 'bird'];
    const MIN_SCORE = 0.45;   // how confident the detector must be (0–1)

    // =====================================================================
    // 3D: SCENE
    // =====================================================================
    const view = document.getElementById('view3d');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    view.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera3 = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
    camera3.position.set(0, 1.8, 6.2);
    camera3.lookAt(0, 1.05, 0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x4a5a4f, 2.0));
    const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(3, 5, 4); scene.add(sun);
    const fill = new THREE.DirectionalLight(0xbfd8ff, 0.8); fill.position.set(-4, 2, -3); scene.add(fill);

    // glowing pedestal under the animal
    function radialTex(stops) {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
      stops.forEach(([o, col]) => gr.addColorStop(o, col));
      g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    }
    const pedestal = new THREE.Group();
    const shadowMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: radialTex([[0, 'rgba(0,0,0,0.55)'], [0.6, 'rgba(0,0,0,0.25)'], [1, 'rgba(0,0,0,0)']]), transparent: true, depthWrite: false }));
    shadowMesh.rotation.x = -Math.PI / 2; shadowMesh.scale.set(3.4, 2.2, 1);
    const glowMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: radialTex([[0, 'rgba(120,255,170,0)'], [0.82, 'rgba(120,255,170,0.05)'], [0.93, 'rgba(150,255,190,0.75)'], [1, 'rgba(120,255,170,0)']]),
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    glowMesh.rotation.x = -Math.PI / 2; glowMesh.position.y = 0.005; glowMesh.scale.set(3.6, 3.6, 1);
    pedestal.add(shadowMesh, glowMesh);
    scene.add(pedestal);

    // =====================================================================
    // 3D: BUILDING BLOCKS
    // =====================================================================
    function canvasTex(w, h, draw) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
      return t;
    }
    function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
    // wraps a blob drawing around the texture edges so patterns tile seamlessly
    function wrapDraw(w, h, x, y, fn) { for (const dx of [-w, 0, w]) for (const dy of [-h, 0, h]) fn(x + dx, y + dy); }

    const TEX = {};
    TEX.grain = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
      const r = rng(7);
      for (let i = 0; i < 2600; i++) {
        const v = 205 + Math.floor(r() * 50);
        g.strokeStyle = `rgb(${v},${v},${v})`; g.lineWidth = 1;
        const x = r() * w, y = r() * h, a = r() * 0.6 - 0.3;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 5, y + Math.sin(a) * 5 + 3); g.stroke();
      }
    });
    TEX.wrinkle = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
      const r = rng(11);
      for (let i = 0; i < 260; i++) {
        const v = 200 + Math.floor(r() * 40), y = r() * h, x = r() * w, len = 14 + r() * 30;
        g.strokeStyle = `rgba(${v},${v},${v},0.55)`; g.lineWidth = 1 + r() * 1.2;
        g.beginPath(); g.moveTo(x, y);
        g.quadraticCurveTo(x + len / 2, y + (r() - 0.5) * 8, x + len, y + (r() - 0.5) * 4); g.stroke();
      }
    });
    TEX.zebra = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = '#f2efe8'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#141414';
      const n = 13;
      for (let i = 0; i < n; i++) {
        const y0 = (i + 0.5) * h / n, th = 11 + (i % 3) * 3;
        g.beginPath();
        for (let x = 0; x <= w; x += 8) g.lineTo(x, y0 + Math.sin(x / w * Math.PI * 4 + i) * 7 - th);
        for (let x = w; x >= 0; x -= 8) g.lineTo(x, y0 + Math.sin(x / w * Math.PI * 4 + i) * 7 + th);
        g.closePath(); g.fill();
      }
    });
    TEX.giraffe = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = '#f2dfb6'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#a5582a';
      const r = rng(3), cell = 64;
      for (let gy = 0; gy < h / cell; gy++) for (let gx = 0; gx < w / cell; gx++) {
        const cx = gx * cell + cell / 2 + (r() - 0.5) * 16, cy = gy * cell + cell / 2 + (r() - 0.5) * 16;
        const pts = Array.from({ length: 7 }, (_, k) => { const a = k / 7 * Math.PI * 2 + r() * 0.4, rr = cell * (0.36 + r() * 0.1); return [Math.cos(a) * rr, Math.sin(a) * rr]; });
        wrapDraw(w, h, cx, cy, (x, y) => { g.beginPath(); pts.forEach(([px, py], k) => k ? g.lineTo(x + px, y + py) : g.moveTo(x + px, y + py)); g.closePath(); g.fill(); });
      }
    });
    TEX.cow = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = '#f7f5f0'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#1b1b1b';
      const r = rng(21);
      for (let i = 0; i < 7; i++) {
        const cx = r() * w, cy = r() * h;
        for (let k = 0; k < 9; k++) {
          const x = cx + (r() - 0.5) * 90, y = cy + (r() - 0.5) * 70, rad = 22 + r() * 30;
          wrapDraw(w, h, x, y, (px, py) => { g.beginPath(); g.ellipse(px, py, rad, rad * (0.7 + r() * 0.4), r() * 3, 0, Math.PI * 2); g.fill(); });
        }
      }
    });
    TEX.tabby = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = '#e7a35e'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#b4672f';
      const n = 16;
      for (let i = 0; i < n; i++) {
        const y0 = (i + 0.5) * h / n, th = 5 + (i % 2) * 3;
        g.beginPath();
        for (let x = 0; x <= w; x += 8) g.lineTo(x, y0 + Math.sin(x / w * Math.PI * 6 + i * 1.7) * 9 - th);
        for (let x = w; x >= 0; x -= 8) g.lineTo(x, y0 + Math.sin(x / w * Math.PI * 6 + i * 1.7) * 9 + th);
        g.closePath(); g.fill();
      }
    });

    const SPH = new THREE.SphereGeometry(1, 40, 28);
    const SPH_X = SPH.clone().rotateZ(Math.PI / 2);   // poles along the body's length (for ring patterns)
    const mats = new Map();
    function M(color, map = TEX.grain, rough = 0.88) {
      const key = color + '|' + (map ? map.uuid : '') + '|' + rough;
      if (!mats.has(key)) mats.set(key, new THREE.MeshStandardMaterial({ color, map, roughness: rough, metalness: 0 }));
      return mats.get(key);
    }
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    function blob(parent, m, p, s, geo = SPH, rot = null) {
      const o = new THREE.Mesh(geo, m);
      o.position.set(p[0], p[1], p[2]); o.scale.set(s[0], s[1], s[2]);
      if (rot) o.rotation.set(rot[0], rot[1], rot[2]);
      parent.add(o); return o;
    }
    // A smooth tapered limb between points a and b
    function tube(parent, m, a, b, r1, r2, caps = true) {
      const A = Array.isArray(a) ? V(...a) : a, B = Array.isArray(b) ? V(...b) : b;
      const len = A.distanceTo(B);
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r2, r1, len, 28, 1, true), m);
      mesh.position.copy(A).add(B).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(V(0, 1, 0), B.clone().sub(A).normalize());
      parent.add(mesh);
      if (caps) { blob(parent, m, A.toArray(), [r1, r1, r1]); blob(parent, m, B.toArray(), [r2, r2, r2]); }
      return mesh;
    }
    // A chain of tubes through several points, tapering from r0 to r1
    function chain(parent, m, pts, r0, r1) {
      for (let i = 0; i < pts.length - 1; i++) {
        const k0 = i / (pts.length - 1), k1 = (i + 1) / (pts.length - 1);
        tube(parent, m, pts[i], pts[i + 1], r0 + (r1 - r0) * k0, r0 + (r1 - r0) * k1);
      }
    }
    function eye(parent, p, r) {
      const side = Math.sign(p[2]) || 1;
      blob(parent, M(0x0d0d0d, null, 0.15), p, [r, r, r]);
      blob(parent, M(0xffffff, null, 0.3), [p[0] + r * 0.45, p[1] + r * 0.4, p[2] + side * r * 0.55], [r * 0.28, r * 0.28, r * 0.28]);
    }

    // =====================================================================
    // 3D: GENERIC FOUR-LEGGED ANIMAL
    // =====================================================================
    function quadruped(o) {
      const root = new THREE.Group(), anim = {};
      const c = o.c;
      const bodyY = o.legLen + o.h * 0.5;
      const slope = o.slope || 0;
      const mBody = M(c.body, o.bodyMap || TEX.grain);
      const geoB = o.bodyMap ? SPH_X : SPH;

      // body: main barrel + chest and rump for a natural silhouette
      const bodyG = new THREE.Group(); bodyG.position.set(0, bodyY, 0); bodyG.rotation.z = slope; root.add(bodyG); anim.body = bodyG;
      blob(bodyG, mBody, [0, 0, 0], [o.len / 2, o.h / 2, o.w / 2], geoB);
      blob(bodyG, mBody, [o.len * 0.27, o.h * 0.04, 0], [o.len * 0.25, o.h * 0.53, o.w * 0.5], geoB);

    // =====================================================================
    // 3D: SHOWING + ANIMATING
    // =====================================================================
    let current3d = null;
    const spin = { yaw: -0.5, auto: true, dragging: false, lastX: 0, idleAt: 0 };
    function show3d(key) {
      if (current3d) scene.remove(current3d.holder);
      const built = BUILD[key]();
      const holder = new THREE.Group(), inner = new THREE.Group();
      inner.add(built.root); holder.add(inner);
      // normalise size & position so every animal fits nicely
      const box = new THREE.Box3().setFromObject(built.root);
      const size = box.getSize(new THREE.Vector3());
      const s = Math.min(2.7 / Math.max(size.x, size.z), 2.3 / size.y);
      inner.scale.setScalar(s);
      const ctr = box.getCenter(new THREE.Vector3());
      inner.position.set(-ctr.x * s, -box.min.y * s, -ctr.z * s);
      scene.add(holder);
      current3d = { key, holder, inner, anim: built.anim, t0: performance.now(), baseScale: s };
      spin.yaw = -0.6;
    }

    const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
    function animate3d(now, dt) {
      if (!current3d) return;
      const t = now / 1000, a = current3d.anim, key = current3d.key;
      const k = Math.min(1, (now - current3d.t0) / 650);
      current3d.holder.scale.setScalar(Math.max(0.001, easeOutBack(k)));
      glowMesh.material.opacity = 0.6 + 0.4 * Math.sin(t * 2.5);
      if (spin.auto && !spin.dragging && now - spin.idleAt > 2500) spin.yaw += dt * 0.45;
      current3d.holder.rotation.y = spin.yaw;

      // idle life
      if (a.body) a.body.scale.y = 1 + 0.018 * Math.sin(t * 2.4);
      if (a.head) { a.head.rotation.y = Math.sin(t * 0.7) * 0.28; a.head.rotation.z = Math.sin(t * 1.1) * 0.06 - (key === 'horse' || key === 'zebra' ? 0.05 : 0); }
      if (a.tail) {

        a.tail.rotation.y = wag;
      }
      if (a.ears) a.ears.forEach((e, i) => {
        if (e.userData.big) e.rotation.y = e.userData.side * (0.15 + 0.22 * (0.5 + 0.5 * Math.sin(t * 1.6)));
        else e.rotation.y = Math.max(0, Math.sin(t * 0.9 + i * 2.2) - 0.92) * 4 * e.userData.side;
      });
      if (a.trunk) { a.trunk.rotation.z = Math.sin(t * 1.1) * 0.18; a.trunk.rotation.x = Math.sin(t * 0.7) * 0.15; }
      if (a.wings) {
        const ph = t % 4;
        const flap = ph < 0.9 ? Math.sin(ph * 28) * 0.9 * Math.sin(ph / 0.9 * Math.PI) : 0;
        a.wings.forEach(w => { w.rotation.x = -w.userData.side * Math.max(0, flap); });
        if (a.head) { a.head.rotation.z = Math.sin(t * 3) * 0.12; a.head.rotation.y = Math.round(Math.sin(t * 0.8) * 2) * 0.25; }
      }
    }

    // drag to rotate
    view.addEventListener('pointerdown', e => { spin.dragging = true; spin.lastX = e.clientX; view.setPointerCapture(e.pointerId); view.style.cursor = 'grabbing'; });
    view.addEventListener('pointermove', e => { if (!spin.dragging) return; spin.yaw += (e.clientX - spin.lastX) * 0.012; spin.lastX = e.clientX; });
    const endDrag = () => { spin.dragging = false; spin.idleAt = performance.now(); view.style.cursor = 'grab'; };
    view.addEventListener('pointerup', endDrag); view.addEventListener('pointercancel', endDrag);

    // =====================================================================
    // CAMERA FEED + DETECTION
    // =====================================================================
    const demo = new URLSearchParams(location.search).has('demo');
    const cam = document.getElementById('cam'), cctx = cam.getContext('2d');
    const video = document.getElementById('v');
    const statusEl = document.getElementById('status');
    let W = 0, H = 0, DPR = 1, facing = 'environment', detector = null;
    let vmap = { s: 1, ox: 0, oy: 0, dw: 0, dh: 0 };
    let dets = [], lastDetect = 0, lastVideoTime = -1;
    const votes = {};
    let currentKey = null, manual = false;

    function layout() {
      DPR = Math.min(devicePixelRatio || 1, 2);
      W = cam.width = Math.round(innerWidth * DPR); H = cam.height = Math.round(innerHeight * DPR);
      const card = document.getElementById('card');
      const free = Math.max(160, innerHeight - (document.body.classList.contains('showing') ? card.offsetHeight : 0) - 64);
      view.style.height = free + 'px';
      renderer.setSize(innerWidth, free, false);
      camera3.aspect = innerWidth / free;
      // keep the animal fully in view on narrow (portrait) screens
      camera3.position.z = camera3.aspect < 1 ? 6.2 / Math.max(0.55, camera3.aspect) : 6.2;
      camera3.updateProjectionMatrix();
    }
    addEventListener('resize', layout);

    function drawVideo() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw) return false;
      const s = Math.max(W / vw, H / vh);
      vmap = { s, dw: vw * s, dh: vh * s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2 };
      cctx.save();
      if (facing === 'user') { cctx.translate(W, 0); cctx.scale(-1, 1); }
      cctx.drawImage(video, vmap.ox, vmap.oy, vmap.dw, vmap.dh);
      cctx.restore();
      return true;
    }
    function boxToScreen(b) {
      if (demo) return b;
      let x = vmap.ox + b.originX * vmap.s;
      const y = vmap.oy + b.originY * vmap.s, w = b.width * vmap.s, h = b.height * vmap.s;
      if (facing === 'user') x = W - x - w;
      return { originX: x, originY: y, width: w, height: h };
    }
    function drawBoxes() {
      dets.forEach(d => {
        const b = boxToScreen(d.box);
        const locked = d.label === currentKey;
        const col = locked ? '#7dffad' : '#ffffff';
        const L = Math.min(b.width, b.height) * 0.22;
        cctx.save();
        cctx.strokeStyle = col; cctx.lineWidth = 4 * DPR; cctx.lineCap = 'round';
        cctx.shadowColor = 'rgba(0,0,0,0.5)'; cctx.shadowBlur = 6 * DPR;
        const x0 = b.originX, y0 = b.originY, x1 = x0 + b.width, y1 = y0 + b.height;
        [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]].forEach(([x, y, dx, dy]) => {
          cctx.beginPath(); cctx.moveTo(x + dx * L, y); cctx.lineTo(x, y); cctx.lineTo(x, y + dy * L); cctx.stroke();
        });
        const txt = `${ANIMALS[d.label].emoji} ${ANIMALS[d.label].name} ${Math.round(d.score * 100)}%`;
        cctx.font = `700 ${15 * DPR}px system-ui, sans-serif`;
        const tw = cctx.measureText(txt).width + 18 * DPR, th = 28 * DPR;
        const ty = Math.max(4 * DPR, y0 - th - 6 * DPR);
        cctx.shadowBlur = 0;
        cctx.fillStyle = locked ? '#2f7d4f' : 'rgba(0,0,0,0.6)';
        cctx.beginPath(); cctx.roundRect(x0, ty, tw, th, 14 * DPR); cctx.fill();
        cctx.fillStyle = '#fff'; cctx.textBaseline = 'middle';
        cctx.fillText(txt, x0 + 9 * DPR, ty + th / 2);
        cctx.restore();
      });
    }

    function tallyVotes() {
      Object.keys(votes).forEach(k => votes[k] *= 0.6);
      dets.forEach(d => { if (d.score >= MIN_SCORE) votes[d.label] = (votes[d.label] || 0) + d.score; });
      let best = null, bv = 0;
      Object.keys(votes).forEach(k => { if (votes[k] > bv) { bv = votes[k]; best = k; } });
      if (!manual && best && bv > 1.3 && best !== currentKey) {
        const top = dets.filter(d => d.label === best).sort((a, b) => b.score - a.score)[0];
        showAnimal(best, top ? top.score : null);
      }
    }

    function runDetection(now) {
      if (!detector || now - lastDetect < 110 || video.currentTime === lastVideoTime) return;
      lastDetect = now; lastVideoTime = video.currentTime;
      const res = detector.detectForVideo(video, now);
      dets = (res.detections || []).map(d => ({ label: d.categories[0].categoryName, score: d.categories[0].score, box: d.boundingBox }))
        .filter(d => ANIMALS[d.label]);
      tallyVotes();
    }

    // =====================================================================
    // INFO CARD
    // =====================================================================
    const $ = id => document.getElementById(id);
    function showAnimal(key, score) {
      const a = ANIMALS[key];
      currentKey = key;
      $('cEmoji').textContent = a.emoji; $('cName').textContent = a.name; $('cSci').textContent = a.sci;
      $('cConf').textContent = score != null ? `✓ ${Math.round(score * 100)}% match` : '📖 Browsing';
      $('cDef').textContent = a.def; $('fClass').textContent = a.cls; $('fDiet').textContent = a.diet;
      $('fHab').textContent = a.habitat; $('fLife').textContent = a.life; $('cFact').textContent = a.fact;
      document.body.classList.add('showing');
      $('card').scrollTop = 0;
      show3d(key);
      requestAnimationFrame(layout);
      setTimeout(layout, 480);
      ding();
      if ('speechSynthesis' in window) speechSynthesis.cancel();
    }
    function rescan() {
      currentKey = null; manual = false;
      Object.keys(votes).forEach(k => delete votes[k]);
      document.body.classList.remove('showing');
      if (current3d) { scene.remove(current3d.holder); current3d = null; }
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      layout();
    }

    let actx = null;
    function ding() {
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const t0 = actx.currentTime;
        [880, 1320].forEach((f, i) => {
          const o = actx.createOscillator(), g = actx.createGain();
          o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0 + i * 0.09);
          g.gain.exponentialRampToValueAtTime(0.06, t0 + i * 0.09 + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.09 + 0.25);
          o.connect(g).connect(actx.destination); o.start(t0 + i * 0.09); o.stop(t0 + i * 0.09 + 0.3);
        });
      } catch (e) {}
    }

    $('speakBtn').addEventListener('click', () => {
      if (!currentKey || !('speechSynthesis' in window)) return;
      const a = ANIMALS[currentKey];
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(`${a.name}. ${a.def} Fun fact: ${a.fact}`));
    });
    $('rescanBtn').addEventListener('click', rescan);

    // browse list
    const grid = $('grid');
    ORDER.forEach(k => {
      const b = document.createElement('button');
      b.innerHTML = `${ANIMALS[k].emoji}<span>${ANIMALS[k].name}</span>`;
      b.addEventListener('click', () => { $('list').classList.remove('open'); manual = true; showAnimal(k, null); });
      grid.appendChild(b);
    });
    const openList = () => $('list').classList.add('open');
    $('listBtn').addEventListener('click', openList); $('listBtn2').addEventListener('click', openList);
    $('closeList').addEventListener('click', () => $('list').classList.remove('open'));

    // =====================================================================
    // DEMO MODE (?demo): pretends to detect each animal in turn
    // =====================================================================
    const demoState = { clock: 0 };
    function demoDetect() {
      const ph = demoState.clock % 6, idx = Math.floor(demoState.clock / 6) % ORDER.length;
      const bw = W * 0.6, bh = H * 0.32;
      dets = ph < 0.8 ? [] : [{ label: ORDER[idx], score: 0.86 + 0.08 * Math.sin(demoState.clock * 3), box: { originX: (W - bw) / 2, originY: H * 0.14, width: bw, height: bh } }];
      tallyVotes();
    }

    // =====================================================================
    // MAIN LOOP
    // =====================================================================
    let prev = performance.now(), lastDemoTick = 0;
    function loop(now) {
      const dt = Math.min((now - prev) / 1000, 0.05); prev = now;
      cctx.clearRect(0, 0, W, H);
      if (demo) {
        demoState.clock += dt;
        const g = cctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#5f7f6a'); g.addColorStop(1, '#22352b');
        cctx.fillStyle = g; cctx.fillRect(0, 0, W, H);
        if (now - lastDemoTick > 110) { lastDemoTick = now; demoDetect(); }
      } else if (drawVideo()) {
        runDetection(now);
      }
      document.body.classList.toggle('detecting', dets.length > 0);
      if (!document.body.classList.contains('showing')) drawBoxes();

      animate3d(now, dt);
      if (current3d) renderer.render(scene, camera3);

      if (!detector && !demo) statusEl.textContent = 'Loading animal detector…';
      else if (currentKey) statusEl.textContent = manual ? `📖 ${ANIMALS[currentKey].name}` : `✓ ${ANIMALS[currentKey].name} detected — drag to rotate`;
      else if (dets.length) statusEl.textContent = 'Hold steady…';
      else statusEl.textContent = '🔍 Point the camera at an animal';
      requestAnimationFrame(loop);
    }

    // =====================================================================
    // START
    // =====================================================================
    async function loadDetector() {
      const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.0/wasm');
      const opts = delegate => ({
        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite', delegate },
        runningMode: 'VIDEO', scoreThreshold: 0.3, maxResults: 5, categoryAllowlist: ORDER
      });
      try { detector = await ObjectDetector.createFromOptions(files, opts('GPU')); }
      catch (e) { detector = await ObjectDetector.createFromOptions(files, opts('CPU')); }
    }
    async function startCamera() {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      video.srcObject = stream; await video.play(); lastVideoTime = -1;
    }
    const detPromise = demo ? Promise.resolve() : loadDetector().catch(err => { statusEl.textContent = 'Could not load the detector. Check your internet and reload.'; console.error(err); });

    $('startBtn').addEventListener('click', async () => {
      const msg = $('loadMsg');
      try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
      try {
        if (!demo) { msg.textContent = 'Starting camera…'; await startCamera(); msg.textContent = 'Loading animal detector…'; await detPromise; }
        $('start').style.display = 'none';
      } catch (err) { msg.textContent = 'Camera error: ' + err.message + '. Allow camera access and reload.'; }
    });
    $('flipBtn').addEventListener('click', async () => {
      if (demo) return;
      facing = facing === 'user' ? 'environment' : 'user';
      try { await startCamera(); } catch (e) { statusEl.textContent = 'Could not switch camera'; }
    });

    layout();
    if (demo) window.__demo = demoState;
    requestAnimationFrame(loop);
  </script>
</body>
</html>
